[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dibo"
version = "0.1.0"
description = "Dynamic-neighbor Action Bayesian optimization for vLLM experiments"
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27",
  "numpy>=1.26",
  "pydantic>=2.7",
  "PyYAML>=6.0",
  "scipy>=1.11",
  "scikit-learn>=1.4",
  "typer>=0.12",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6"]
gpu = ["nvidia-ml-py>=12", "vllm==0.11.2"]

[project.scripts]
dibo = "dibo.cli:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["gpu: requires an allocated GPU and a local vLLM model"]

[tool.ruff]
line-length = 100
target-version = "py310"